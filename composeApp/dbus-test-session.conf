<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A session bus for the live D-Bus tests (tray and portals): no service directories, so nothing is
  started on demand. With the stock configuration the first call to org.freedesktop.portal.Desktop
  launches the machine's real xdg-desktop-portal, which then owns the name the stand-in portal needs.
  Use: dbus-run-session with this file as its config file, then xvfb-run, then gradle (see ci.yml).
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
