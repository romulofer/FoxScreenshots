name: Setup Flutter
description: Install the pinned Flutter SDK used by CI and release builds. Run actions/checkout before this (a local composite action can't be resolved until the repo it lives in has been checked out).

inputs:
  flutter-version:
    required: true
  flutter-channel:
    required: true

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.flutter-channel }}
        cache: true
