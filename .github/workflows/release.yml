name: Release

# Builds the installers and attaches them to the GitHub Release: .deb (Linux),
# .msi (Windows) and .dmg (macOS). Trigger: publishing a Release (or a manual
# run for a dry build, which only uploads workflow artifacts). No network or
# telemetry is added — builds are plain Gradle.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to upload assets to the Release

jobs:
  linux:
    # An older Ubuntu keeps the .deb's glibc floor (and library package names) low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        # A dry run from a branch has no version tag: fall back to the default.
        run: |
          v="$(echo '${{ github.ref_name }}' | sed 's/^v//')"
          case "$v" in [0-9]*) ;; *) v=1.0.0 ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: ./gradlew :composeApp:packageDeb -PappVersion="$VERSION" --console=plain
      - name: Name the asset
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb "dist/foxscreenshots-${{ github.ref_name }}-linux-amd64.deb"
      - uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: dist/*
      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        shell: pwsh
        run: |
          # A dry run from a branch has no version tag: fall back to the default.
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d') { $v = "1.0.0" }
          echo "VERSION=$v" >> $env:GITHUB_ENV
      - run: ./gradlew.bat :composeApp:packageMsi "-PappVersion=$env:VERSION" --console=plain
        shell: pwsh
      - name: Name the asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-ChildItem composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1) "dist/foxscreenshots-${{ github.ref_name }}-windows-x64.msi"
      - uses: actions/upload-artifact@v5
        with:
          name: windows-msi
          path: dist/*
      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        # A dry run from a branch has no version tag: fall back to the default.
        run: |
          v="$(echo '${{ github.ref_name }}' | sed 's/^v//')"
          case "$v" in [0-9]*) ;; *) v=1.0.0 ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # iconutil only exists on macOS, so the .icns is made here from the PNG.
      - name: Build the app icon
        run: |
          mkdir icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size composeApp/packaging/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
          done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o composeApp/packaging/icon.icns
      - run: ./gradlew :composeApp:packageDmg -PappVersion="$VERSION" --console=plain
      - name: Name the asset
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "dist/foxscreenshots-${{ github.ref_name }}-macos.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: dist/*
      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
