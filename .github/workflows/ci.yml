name: CI

# Unit and UI tests on the three desktop systems. Linux runs under xvfb, where
# the live checks (X11 capture, global hotkeys, clipboard) also run, on a
# throwaway display. Runs on every push and pull request. No network access is
# needed by the app or its tests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The keyboard hook library links these; xvfb gives the live tests a display, xdotool drives it.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils x11-apps \
            libxkbcommon-x11-0 libxkbfile1 libxt6 libxinerama1 libxcb-xkb1 libx11-xcb1

      - name: Tests (under xvfb)
        env:
          # The live tests inject keys and write the clipboard: only ever on a throwaway display.
          FOX_ISOLATED_DISPLAY: "1"
        run: xvfb-run -a -s "-screen 0 1400x900x24" ./gradlew :composeApp:desktopTest --console=plain

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-reports
          path: composeApp/build/reports/tests

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest --console=plain

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat :composeApp:desktopTest --console=plain
