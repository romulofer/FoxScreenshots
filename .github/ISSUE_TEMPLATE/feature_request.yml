name: "✨ Sugestão de funcionalidade / Feature request"
description: Proponha algo novo ou uma melhoria. / Propose something new or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir, lembre que o projeto não pretende cobrir (vídeo/GIF,
        sincronização em nuvem, edição pesada, OCR).

        Before opening, keep in mind this project won't cover (video/GIF, cloud
        sync, heavy editing, OCR).

  - type: textarea
    id: problem
    attributes:
      label: "Qual problema isso resolve? / What problem does this solve?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "O que você propõe? / What are you proposing?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativas consideradas (opcional) / Alternatives considered (optional)"
